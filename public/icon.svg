<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1445"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle inner light -->
  <ellipse cx="256" cy="100" rx="220" ry="80" fill="#3b82f6" opacity="0.06"/>

  <!-- Chart bars (ascending left to right) -->
  <rect x="58"  y="370" width="58" height="100" rx="10" fill="url(#bar)" opacity="0.45"/>
  <rect x="136" y="310" width="58" height="160" rx="10" fill="url(#bar)" opacity="0.6"/>
  <rect x="214" y="235" width="58" height="235" rx="10" fill="url(#bar)" opacity="0.75"/>
  <rect x="292" y="170" width="58" height="300" rx="10" fill="url(#bar)" opacity="0.9"/>
  <!-- Tallest bar – green (today's winner) -->
  <rect x="370" y="100" width="68" height="370" rx="10" fill="url(#grn)"/>

  <!-- Sheen on green bar -->
  <rect x="370" y="100" width="20" height="370" rx="10" fill="#ffffff" opacity="0.08"/>

  <!-- Golden trend line -->
  <polyline
    points="87,350 165,290 243,215 321,150 404,83"
    fill="none"
    stroke="#f59e0b"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrow cap: circle + chevron -->
  <circle cx="404" cy="66" r="24" fill="#f59e0b"/>
  <!-- Chevron up -->
  <polyline points="392,74 404,52 416,74" fill="none" stroke="#0c1445" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Baseline -->
  <line x1="48" y1="470" x2="464" y2="470" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
